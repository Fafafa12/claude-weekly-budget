name: Tests

# Every push to main and every pull request: the marketplace and the plugin are
# validated the way Claude Code reads them, and the whole test suite runs. The tests
# need no Claude login; they fake the engine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Claude Code the plugin is built and tested against. Raise it on purpose.
      CLAUDE_CODE_VERSION: 2.1.319
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate the plugin
        run: claude plugin validate weekly-budget

      - name: Run the tests
        run: claude plugin test weekly-budget
